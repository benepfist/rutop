# Builds rutop with docker/Dockerfile (same as build.ps1 / build.sh).
# Push/PR: build + tests, binaries as workflow artifact.
# Tag v*:  additionally publishes a GitHub Release with the binaries, .deb/.rpm and SHA256SUMS,
#          and (not for pre-releases) the dnf/apt repository on GitHub Pages.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
          tag_version=${GITHUB_REF_NAME#v}
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build (cargo test + cross-compile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: export
          outputs: type=local,dest=dist
          push: false
          # otherwise buildx writes provenance.json into dist/
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Packages (.deb, .rpm)
        env:
          # only tag builds sign the .rpm (dnf repo uses gpgcheck=1)
          SIGNING_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.PACKAGE_SIGNING_KEY || '' }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/signing-key.asc"
            export RPM_SIGNING_KEY_FILE="$RUNNER_TEMP/signing-key.asc"
          elif [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            echo "::warning::secret PACKAGE_SIGNING_KEY not set, .rpm is unsigned"
          fi
          sh packaging/build-packages.sh
          rm -f "$RUNNER_TEMP/signing-key.asc"

      - name: Checksums
        run: |
          cd dist
          sha256sum rutop* > SHA256SUMS
          ls -l
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: rutop-binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rutop-binaries
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --generate-notes --title "rutop $GITHUB_REF_NAME" $prerelease

  # dnf/apt repository on GitHub Pages, rebuilt from the packages of all (non-pre-)releases
  pages:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install repo tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends createrepo-c apt-utils

      - name: Import signing key
        env:
          SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::secret PACKAGE_SIGNING_KEY not set (see README, Linux packages)"
            exit 1
          fi
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          echo "GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_ENV"

      - name: Download packages of all releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p packages
          for tag in $(gh release list --exclude-pre-releases --limit 1000 --json tagName -q '.[].tagName'); do
            gh release download "$tag" -D packages -p '*.rpm' -p '*.deb' || echo "no packages in $tag"
          done
          ls -l packages

      - name: Build repository
        run: sh packaging/publish-repo.sh packages site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
