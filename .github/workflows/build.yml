# Builds rutop with docker/Dockerfile (same as build.ps1 / build.sh).
# Push/PR: build + tests, binaries as workflow artifact.
# Tag v*:  additionally publishes a GitHub Release with the binaries and SHA256SUMS.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
          tag_version=${GITHUB_REF_NAME#v}
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build (cargo test + cross-compile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: export
          outputs: type=local,dest=dist
          push: false
          # otherwise buildx writes provenance.json into dist/
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checksums
        run: |
          cd dist
          sha256sum rutop-* > SHA256SUMS
          ls -l
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: rutop-binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rutop-binaries
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --generate-notes --title "rutop $GITHUB_REF_NAME" $prerelease
